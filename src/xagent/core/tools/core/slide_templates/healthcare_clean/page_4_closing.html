<!DOCTYPE html>
<html lang="en" data-template="healthcare_clean" data-page="4">
<head>
<meta charset="utf-8"/>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  body { margin: 0; width: 1280px; height: 720px; font-family: 'Manrope', system-ui, sans-serif;
         background-color: #f4faf9; color: #0e2a35; position: relative; overflow: hidden; }
  .pill-a { position: absolute; left: -200px; bottom: -200px; width: 560px; height: 560px;
            background-color: #e0f3f1; border-radius: 9999px; }
  .pill-b { position: absolute; right: -160px; top: -160px; width: 480px; height: 480px;
            background-color: #c2e9e4; border-radius: 9999px; }
  .teal-mark { position: absolute; right: 120px; top: 120px; width: 80px; height: 80px;
               background-color: #2fb6a0; border-radius: 9999px;
               display: flex; align-items: center; justify-content: center;
               color: #ffffff; font-size: 36px; font-weight: 700; }

  .stack { position: absolute; left: 80px; top: 50%; transform: translateY(-50%); max-width: 760px; }
  .headline { font-size: 96px; line-height: 1; font-weight: 800; color: #0e2a35; letter-spacing: -0.03em; }
  .headline .accent { color: #2fb6a0; }
  .tagline  { font-size: 20px; line-height: 1.6; color: #486975; margin-top: 32px; font-weight: 500;
              max-width: 640px; }
  .contacts { margin-top: 48px; display: flex; gap: 16px; }
  .contact  { padding: 14px 22px; background-color: #ffffff; border-radius: 9999px;
              font-size: 14px; font-weight: 600; color: #0e2a35; letter-spacing: 0.02em;
              border: 1px solid #e0f3f1; }

  .teal-bar { position: absolute; left: 0; bottom: 0; width: 100%; height: 6px; background: #2fb6a0; }
</style>
</head>
<body>
  <div class="pill-a"></div>
  <div class="pill-b"></div>
  <div class="teal-mark">+</div>
  <div class="stack">
    <div class="headline" data-slot="headline">Questions?</div>
    <div class="tagline"  data-slot="tagline">Reach out with case-specific questions or to request the full dataset for review.</div>
    <div class="contacts">
      <div class="contact" data-slot="contact_1">research@hospital.org</div>
      <div class="contact" data-slot="contact_2">+1 (555) 0100</div>
    </div>
  </div>
  <div class="teal-bar"></div>
</body>
</html>
