<!DOCTYPE html>
<html lang="en" data-template="startup_pitch" data-page="3">
<head>
<meta charset="utf-8"/>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  body { margin: 0; width: 1280px; height: 720px;
         font-family: 'Space Grotesk', system-ui, sans-serif;
         background-color: #ffffff; color: #0a0a0a; position: relative; overflow: hidden; }
  .heading-tag { position: absolute; left: 80px; top: 80px;
                 font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700;
                 letter-spacing: 0.2em; color: #0a0a0a; }
  .heading-rule { position: absolute; left: 80px; top: 108px; width: 64px; height: 4px; background: #ffd400; }
  .heading { position: absolute; left: 80px; top: 130px;
             font-size: 32px; line-height: 1.2; font-weight: 500; color: #888; letter-spacing: -0.01em; }

  .pyramid { position: absolute; left: 80px; top: 220px; width: 560px; }
  .ring { display: flex; align-items: center; gap: 24px; margin-bottom: 18px; }
  .bar  { height: 60px; background-color: #0a0a0a; display: flex; align-items: center; padding: 0 20px;
          color: #ffffff; font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700; letter-spacing: 0.15em; }
  .bar.tam { width: 100%; background-color: #0a0a0a; }
  .bar.sam { width: 70%;  background-color: #2a2a2a; }
  .bar.som { width: 40%;  background-color: #ffd400; color: #0a0a0a; }
  .value { font-size: 28px; font-weight: 700; color: #0a0a0a; letter-spacing: -0.01em;
           font-family: 'Space Grotesk', sans-serif; min-width: 100px; }

  .legend { position: absolute; right: 80px; top: 220px; width: 320px;
            padding: 32px 28px; background-color: #fafafa; border-left: 4px solid #ffd400; }
  .legend-row { display: flex; justify-content: space-between; padding: 14px 0;
                border-bottom: 1px solid #eee; font-size: 16px; }
  .legend-row:last-child { border-bottom: 0; }
  .legend-label { font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700;
                  letter-spacing: 0.15em; color: #555; }
  .legend-value { font-weight: 700; color: #0a0a0a; }

  .note { position: absolute; left: 80px; bottom: 80px; right: 80px;
          font-size: 15px; line-height: 1.55; color: #555; font-style: italic; }
  .footer-marks { position: absolute; right: 80px; bottom: 36px;
                  font-family: 'JetBrains Mono', monospace; font-size: 11px;
                  letter-spacing: 0.15em; color: #888; }
</style>
</head>
<body>
  <div class="heading-tag">MARKET</div>
  <div class="heading-rule"></div>
  <div class="heading" data-slot="heading">where the dollars actually are</div>

  <div class="pyramid">
    <div class="ring">
      <div class="value" data-slot="tam">$48B</div>
      <div class="bar tam" data-slot="tam_label">TAM · TOTAL ADDRESSABLE</div>
    </div>
    <div class="ring">
      <div class="value" data-slot="sam">$9.2B</div>
      <div class="bar sam" data-slot="sam_label">SAM · SERVICEABLE</div>
    </div>
    <div class="ring">
      <div class="value" data-slot="som">$420M</div>
      <div class="bar som" data-slot="som_label">SOM · 3-YEAR REACHABLE</div>
    </div>
  </div>

  <div class="legend">
    <div class="legend-row">
      <span class="legend-label" data-slot="tam_label">TAM</span><span class="legend-value" data-slot="tam">$48B</span>
    </div>
    <div class="legend-row">
      <span class="legend-label" data-slot="sam_label">SAM</span><span class="legend-value" data-slot="sam">$9.2B</span>
    </div>
    <div class="legend-row">
      <span class="legend-label" data-slot="som_label">SOM</span><span class="legend-value" data-slot="som">$420M</span>
    </div>
  </div>

  <div class="note" data-slot="note">Source line. Cite the analyst report or your own bottoms-up model in one line so the reader can verify the maths.</div>
  <div class="footer-marks">04 / 05 · MARKET</div>
</body>
</html>
