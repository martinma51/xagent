<!DOCTYPE html>
<html lang="en" data-template="product_neon" data-page="0">
<head>
<meta charset="utf-8"/>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  body { margin: 0; width: 1280px; height: 720px;
         font-family: 'Bricolage Grotesque', system-ui, sans-serif;
         background-color: #0b031a; color: #ffffff; position: relative; overflow: hidden; }
  .grad-a { position: absolute; left: 820px; top: -240px; width: 680px; height: 680px;
            background: radial-gradient(circle at center, rgba(255, 60, 200, 0.55), transparent 60%);
            filter: blur(40px); }
  .grad-b { position: absolute; left: 640px; top: -340px; width: 720px; height: 720px;
            background: radial-gradient(circle at center, rgba(50, 220, 255, 0.45), transparent 60%);
            filter: blur(50px); }
  .grad-c { position: absolute; left: -240px; top: 80px; width: 540px; height: 540px;
            background: radial-gradient(circle at center, rgba(140, 80, 255, 0.50), transparent 60%);
            filter: blur(45px); }
  .grid-bg { position: absolute; inset: 0; opacity: 0.12;
             background-image:
               linear-gradient(rgba(255,255,255,0.6) 1px, transparent 1px),
               linear-gradient(90deg, rgba(255,255,255,0.6) 1px, transparent 1px);
             background-size: 80px 80px; mix-blend-mode: screen; }

  .eyebrow { position: absolute; left: 80px; top: 80px; padding: 6px 14px;
             border: 1px solid rgba(255, 255, 255, 0.3);
             font-family: 'JetBrains Mono', monospace;
             font-size: 12px; font-weight: 700; letter-spacing: 0.22em; color: #ffffff;
             backdrop-filter: blur(8px); background: rgba(255, 255, 255, 0.04);
             border-radius: 9999px; }
  .version { position: absolute; right: 80px; top: 80px; padding: 6px 14px;
             background: linear-gradient(90deg, #ff3cc8, #32dcff);
             font-family: 'JetBrains Mono', monospace;
             font-size: 12px; font-weight: 700; letter-spacing: 0.18em; color: #0b031a;
             border-radius: 9999px; }

  .title { position: absolute; left: 80px; top: 230px; width: 1120px;
           font-size: 108px; line-height: 0.96; font-weight: 800; color: #ffffff;
           letter-spacing: -0.035em; }
  .title .accent { background: linear-gradient(90deg, #ff3cc8, #32dcff);
                   -webkit-background-clip: text; background-clip: text; color: transparent; }
  .subtitle { position: absolute; left: 80px; top: 540px; width: 800px;
              font-size: 22px; line-height: 1.55; color: #e8dfff; font-weight: 500;
              text-shadow: 0 2px 12px rgba(11, 3, 26, 0.85); }
  .date { position: absolute; right: 80px; bottom: 64px;
          font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 600;
          letter-spacing: 0.18em; color: #ffffff; }
  .bottom-rule { position: absolute; left: 80px; bottom: 64px; width: 80px; height: 2px;
                 background: linear-gradient(90deg, #ff3cc8, #32dcff); }
</style>
</head>
<body>
  <div class="grad-c"></div>
  <div class="grad-a"></div>
  <div class="grad-b"></div>
  <div class="grid-bg"></div>
  <div class="eyebrow" data-slot="eyebrow">PRODUCT · LAUNCH 2026</div>
  <div class="version" data-slot="version">v3.0 · OUT NOW</div>
  <div class="title" data-slot="title">Meet the <span class="accent">brightest</span> release yet.</div>
  <div class="subtitle" data-slot="subtitle">A short framing sentence that tells the audience what this is, who it's for, and why it's the most interesting thing on stage today.</div>
  <div class="bottom-rule"></div>
  <div class="date" data-slot="date">MAY · 2026</div>
</body>
</html>
