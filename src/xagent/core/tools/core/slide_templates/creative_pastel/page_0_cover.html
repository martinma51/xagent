<style>

  .dot { width: 10px; height: 10px; border-radius: 9999px; background: #2a1f4a; display: inline-block; margin: 0 6px; opacity: 0.4; }
  .tag { position: absolute; left: 80px; top: 96px; padding: 8px 18px;
         background-color: #2a1f4a; color: #efeafe; border-radius: 9999px;

           font-family: 'DM Serif Display', Georgia, serif;

  .title em { font-style: italic; color: #6b4dd9; }
  .subtitle { position: absolute; left: 80px; top: 510px; width: 720px;
              font-size: 20px; line-height: 1.55; color: #4d3f74; font-weight: 500; }
  .author { position: absolute; left: 80px; bottom: 64px;
            font-size: 14px; font-weight: 600; color: #2a1f4a; letter-spacing: 0.04em; }
  .date   { position: absolute; left: 80px; bottom: 40px; font-size: 13px; color: #6b4dd9; letter-spacing: 0.12em; }
</style>
</head>
<body>
  <div class="blob-a"></div>
  <div class="blob-b"></div>
  <div class="blob-c"></div>
