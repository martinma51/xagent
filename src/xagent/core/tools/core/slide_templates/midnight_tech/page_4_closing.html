<!DOCTYPE html>
<html lang="en" data-template="midnight_tech" data-page="4">
<head>
<meta charset="utf-8"/>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  body { margin: 0; width: 1280px; height: 720px; font-family: 'Inter', system-ui, sans-serif;
         background-image: linear-gradient(135deg, rgb(8, 11, 30), rgb(28, 22, 79)); color: rgb(248, 250, 252); }
  .grid-overlay { position: absolute; inset: 0; opacity: 0.10;
    background-image: linear-gradient(rgba(99,102,241,0.15) 1px, transparent 1px),
                      linear-gradient(90deg, rgba(99,102,241,0.15) 1px, transparent 1px);
    background-size: 64px 64px; }
  .glow-l { position: absolute; left: -120px; top: 200px; width: 360px; height: 360px;
            background-color: rgba(56, 189, 248, 0.16); border-radius: 9999px; filter: blur(10px); }
  .glow-r { position: absolute; left: 1040px; top: 240px; width: 360px; height: 360px;
            background-color: rgba(168, 85, 247, 0.20); border-radius: 9999px; filter: blur(10px); }
  .headline { position: absolute; left: 80px; top: 240px; width: 1120px;
              font-size: 112px; line-height: 1.0; font-weight: 800;
              color: rgb(255, 255, 255); text-align: center; }
  .tagline  { position: absolute; left: 80px; top: 400px; width: 1120px;
              font-size: 22px; line-height: 1.55; color: rgb(148, 163, 184); text-align: center; }
  .accent   { position: absolute; left: 600px; top: 510px; width: 80px; height: 4px;
              background-color: rgb(99, 102, 241); border-radius: 2px; }
  .contact-1 { position: absolute; left: 80px; top: 580px; width: 1120px;
               font-size: 18px; font-weight: 500; color: rgb(226, 232, 240); text-align: center; }
  .contact-2 { position: absolute; left: 80px; top: 612px; width: 1120px;
               font-size: 16px; color: rgb(148, 163, 184); text-align: center; }
</style>
</head>
<body>
  <div class="grid-overlay"></div>
  <div class="glow-l"></div>
  <div class="glow-r"></div>
  <div class="headline"  data-slot="headline">Thank you</div>
  <div class="tagline"   data-slot="tagline">A one-sentence closing thought or call to action that wraps the presentation.</div>
  <div class="accent"></div>
  <div class="contact-1" data-slot="contact_1">hello@example.com</div>
  <div class="contact-2" data-slot="contact_2">example.com</div>
</body>
</html>
