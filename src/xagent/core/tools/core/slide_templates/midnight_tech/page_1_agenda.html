<!DOCTYPE html>
<html lang="en" data-template="midnight_tech" data-page="1">
<head>
<meta charset="utf-8"/>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  body { margin: 0; width: 1280px; height: 720px; font-family: 'Inter', system-ui, sans-serif;
         background-image: linear-gradient(135deg, rgb(8, 11, 30), rgb(28, 22, 79)); color: rgb(248, 250, 252); }
  .grid-overlay { position: absolute; inset: 0; opacity: 0.12;
    background-image: linear-gradient(rgba(99,102,241,0.15) 1px, transparent 1px),
                      linear-gradient(90deg, rgba(99,102,241,0.15) 1px, transparent 1px);
    background-size: 64px 64px; }
  .pill { position: absolute; left: 80px; top: 80px; height: 32px; padding: 0 16px;
          background-color: rgba(99, 102, 241, 0.22); border-radius: 9999px;
          font-size: 12px; font-weight: 600; letter-spacing: 0.18em; color: rgb(196, 181, 253);
          display: flex; align-items: center; }
  .heading { position: absolute; left: 80px; top: 130px; width: 900px;
             font-size: 56px; font-weight: 700; color: rgb(255, 255, 255); }
  .accent  { position: absolute; left: 80px; top: 222px; width: 80px; height: 4px;
             background-color: rgb(99, 102, 241); border-radius: 2px; }
  .row     { position: absolute; left: 80px; width: 1120px; height: 64px; }
  .num     { position: absolute; left: 0; top: 0; width: 56px; height: 56px;
             background-color: rgba(99, 102, 241, 0.16); border: 1px solid rgba(99, 102, 241, 0.45);
             border-radius: 9999px; display: flex; align-items: center; justify-content: center;
             font-size: 20px; font-weight: 700; color: rgb(196, 181, 253); }
  .text    { position: absolute; left: 92px; top: 12px; width: 1020px;
             font-size: 24px; font-weight: 500; color: rgb(226, 232, 240); }
</style>
</head>
<body>
  <div class="grid-overlay"></div>
  <div class="pill" data-slot="section_label">AGENDA</div>
  <div class="heading" data-slot="heading">What we'll cover today</div>
  <div class="accent"></div>

  <div class="row" style="top: 270px;">
    <div class="num">01</div>
    <div class="text" data-slot="item_1">First agenda item</div>
  </div>
  <div class="row" style="top: 350px;">
    <div class="num">02</div>
    <div class="text" data-slot="item_2">Second agenda item</div>
  </div>
  <div class="row" style="top: 430px;">
    <div class="num">03</div>
    <div class="text" data-slot="item_3">Third agenda item</div>
  </div>
  <div class="row" style="top: 510px;">
    <div class="num">04</div>
    <div class="text" data-slot="item_4">Fourth agenda item</div>
  </div>
  <div class="row" style="top: 590px;">
    <div class="num">05</div>
    <div class="text" data-slot="item_5">Fifth agenda item</div>
  </div>
</body>
</html>
