<!DOCTYPE html>
<html lang="en" data-template="midnight_tech" data-page="2">
<head>
<meta charset="utf-8"/>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  body { margin: 0; width: 1280px; height: 720px; font-family: 'Inter', system-ui, sans-serif;
         background-image: linear-gradient(135deg, rgb(8, 11, 30), rgb(28, 22, 79)); color: rgb(248, 250, 252); }
  .grid-overlay { position: absolute; inset: 0; opacity: 0.10;
    background-image: linear-gradient(rgba(99,102,241,0.15) 1px, transparent 1px),
                      linear-gradient(90deg, rgba(99,102,241,0.15) 1px, transparent 1px);
    background-size: 64px 64px; }
  .glow { position: absolute; left: 480px; top: 80px; width: 480px; height: 480px;
          background-color: rgba(99, 102, 241, 0.15); border-radius: 9999px; filter: blur(10px); }
  .number  { position: absolute; left: 80px; top: 140px; width: 760px;
             font-size: 320px; line-height: 0.9; font-weight: 800;
             color: rgba(99, 102, 241, 0.16); letter-spacing: -0.04em; }
  .label   { position: absolute; left: 80px; top: 220px; height: 32px; padding: 0 16px;
             background-color: rgba(99, 102, 241, 0.22); border-radius: 9999px;
             font-size: 12px; font-weight: 600; letter-spacing: 0.18em; color: rgb(196, 181, 253);
             display: flex; align-items: center; }
  .title   { position: absolute; left: 80px; top: 300px; width: 1100px;
             font-size: 88px; line-height: 1.05; font-weight: 800; color: rgb(255, 255, 255); }
  .accent  { position: absolute; left: 80px; top: 480px; width: 80px; height: 4px;
             background-color: rgb(99, 102, 241); border-radius: 2px; }
  .desc    { position: absolute; left: 80px; top: 510px; width: 880px;
             font-size: 22px; line-height: 1.55; color: rgb(148, 163, 184); }
</style>
</head>
<body>
  <div class="grid-overlay"></div>
  <div class="glow"></div>
  <div class="number" data-slot="number">01</div>
  <div class="label">SECTION</div>
  <div class="title"  data-slot="title">Section Title</div>
  <div class="accent"></div>
  <div class="desc"   data-slot="description">A brief one or two sentence description of what this section covers and why it matters to the audience.</div>
</body>
</html>
