<!DOCTYPE html>
<html lang="en" data-template="clean_light" data-page="0">
<head>
<meta charset="utf-8"/>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  body { margin: 0; width: 1280px; height: 720px; background-color: rgb(250, 250, 247); color: rgb(26, 31, 46); font-family: 'Inter', system-ui, sans-serif; }
  .frame { position: absolute; left: 80px; top: 80px; right: 80px; bottom: 80px; border: 1px solid rgba(26, 31, 46, 0.10); }
  .corner-tl { position: absolute; left: 70px; top: 70px; width: 20px; height: 20px; border-top: 2px solid rgb(22, 101, 52); border-left: 2px solid rgb(22, 101, 52); }
  .corner-br { position: absolute; right: 70px; bottom: 70px; width: 20px; height: 20px; border-bottom: 2px solid rgb(22, 101, 52); border-right: 2px solid rgb(22, 101, 52); }
  .eyebrow { position: absolute; left: 120px; top: 160px; font-size: 12px; font-weight: 600; letter-spacing: 0.32em; color: rgb(22, 101, 52); }
  .title { position: absolute; left: 120px; top: 210px; width: 1040px; font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 600; font-size: 96px; line-height: 1.05; color: rgb(26, 31, 46); letter-spacing: -0.01em; }
  .rule { position: absolute; left: 120px; top: 460px; width: 80px; height: 2px; background-color: rgb(22, 101, 52); }
  .subtitle { position: absolute; left: 120px; top: 490px; width: 880px; font-size: 18px; line-height: 1.6; color: rgb(75, 85, 99); }
  .meta { position: absolute; left: 120px; right: 120px; bottom: 130px; display: flex; justify-content: space-between; font-size: 13px; color: rgb(107, 114, 128); letter-spacing: 0.04em; }
  .author { font-weight: 500; color: rgb(26, 31, 46); }
</style>
</head>
<body>
  <div class="frame"></div>
  <div class="corner-tl"></div>
  <div class="corner-br"></div>
  <div class="eyebrow" data-slot="eyebrow">QUARTERLY BRIEFING</div>
  <div class="title"   data-slot="title">A Considered Title</div>
  <div class="rule"></div>
  <div class="subtitle" data-slot="subtitle">A measured one-sentence framing that sets the tone for the conversation that follows.</div>
  <div class="meta">
    <span class="author" data-slot="author">Speaker Name</span>
    <span data-slot="date">May 2026</span>
  </div>
</body>
</html>
