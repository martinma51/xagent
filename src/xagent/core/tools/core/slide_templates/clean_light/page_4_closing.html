<!DOCTYPE html>
<html lang="en" data-template="clean_light" data-page="4">
<head>
<meta charset="utf-8"/>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  body { margin: 0; width: 1280px; height: 720px; background-color: rgb(250, 250, 247); color: rgb(26, 31, 46); font-family: 'Inter', system-ui, sans-serif; }
  .frame { position: absolute; left: 80px; top: 80px; right: 80px; bottom: 80px; border: 1px solid rgba(26, 31, 46, 0.10); }
  .corner-tl { position: absolute; left: 70px; top: 70px; width: 20px; height: 20px; border-top: 2px solid rgb(22, 101, 52); border-left: 2px solid rgb(22, 101, 52); }
  .corner-br { position: absolute; right: 70px; bottom: 70px; width: 20px; height: 20px; border-bottom: 2px solid rgb(22, 101, 52); border-right: 2px solid rgb(22, 101, 52); }
  .headline { position: absolute; left: 80px; top: 270px; width: 1120px; font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 600; font-size: 128px; line-height: 1.0; text-align: center; color: rgb(26, 31, 46); }
  .rule { position: absolute; left: 600px; top: 432px; width: 80px; height: 2px; background-color: rgb(22, 101, 52); }
  .tagline { position: absolute; left: 80px; top: 470px; width: 1120px; font-size: 19px; line-height: 1.55; text-align: center; color: rgb(75, 85, 99); }
  .contact { position: absolute; left: 80px; width: 1120px; text-align: center; font-size: 14px; }
  .contact-1 { top: 580px; font-weight: 500; color: rgb(26, 31, 46); letter-spacing: 0.02em; }
  .contact-2 { top: 610px; color: rgb(107, 114, 128); }
</style>
</head>
<body>
  <div class="frame"></div>
  <div class="corner-tl"></div>
  <div class="corner-br"></div>
  <div class="headline"   data-slot="headline">Thank you.</div>
  <div class="rule"></div>
  <div class="tagline"    data-slot="tagline">A one-sentence closing thought or invitation to keep the conversation going.</div>
  <div class="contact contact-1" data-slot="contact_1">hello@example.com</div>
  <div class="contact contact-2" data-slot="contact_2">example.com</div>
</body>
</html>
