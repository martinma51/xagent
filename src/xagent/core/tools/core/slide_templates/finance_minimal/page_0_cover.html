<!DOCTYPE html>
<html lang="en" data-template="finance_minimal" data-page="0">
<head>
<meta charset="utf-8"/>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  body { margin: 0; width: 1280px; height: 720px;
         font-family: 'Inter', system-ui, sans-serif;
         background-color: #ffffff; color: #0c0c0c; position: relative; overflow: hidden; }
  .top-line    { position: absolute; left: 80px; right: 80px; top: 60px; height: 1px; background: #b8975c; }
  .bottom-line { position: absolute; left: 80px; right: 80px; bottom: 60px; height: 1px; background: #b8975c; }

  .firm { position: absolute; left: 80px; top: 76px;
          font-family: 'Inter', sans-serif; font-size: 11px; font-weight: 700;
          letter-spacing: 0.32em; color: #0c0c0c; text-transform: uppercase;
          background: #ffffff; padding-right: 16px; }
  .period { position: absolute; right: 80px; top: 76px;
            font-family: 'Inter', sans-serif; font-size: 11px; font-weight: 700;
            letter-spacing: 0.32em; color: #b8975c; text-transform: uppercase;
            background: #ffffff; padding-left: 16px; }

  .title { position: absolute; left: 80px; top: 220px; width: 1000px;
           font-family: 'Libre Caslon Text', Georgia, serif;
           font-size: 88px; line-height: 1.05; font-weight: 700; color: #0c0c0c; letter-spacing: -0.01em; }
  .gold-rule { position: absolute; left: 80px; top: 420px; width: 80px; height: 2px; background: #b8975c; }
  .subtitle { position: absolute; left: 80px; top: 460px; width: 700px;
              font-family: 'Libre Caslon Text', Georgia, serif; font-style: italic;
              font-size: 20px; line-height: 1.6; color: #555; font-weight: 400; }

  .date-block { position: absolute; right: 80px; bottom: 90px; text-align: right; }
  .date-label { font-size: 10px; font-weight: 700; letter-spacing: 0.32em; color: #888;
                text-transform: uppercase; }
  .date-value { font-family: 'Libre Caslon Text', serif; font-size: 28px; font-weight: 700;
                color: #0c0c0c; margin-top: 6px; letter-spacing: -0.005em; }

  .filing-stamp { position: absolute; left: 80px; bottom: 90px;
                  font-family: 'Inter', sans-serif; font-size: 10px; font-weight: 600;
                  letter-spacing: 0.28em; color: #888; }
</style>
</head>
<body>
  <div class="top-line"></div>
  <div class="bottom-line"></div>
  <div class="firm" data-slot="firm">Hawthorne Capital Partners</div>
  <div class="period" data-slot="period">Q1 2026 RESULTS</div>
  <div class="title" data-slot="title">A measured year, plainly told.</div>
  <div class="gold-rule"></div>
  <div class="subtitle" data-slot="subtitle">Quarterly summary, key performance indicators, and our outlook for the remainder of the year.</div>
  <div class="filing-stamp">INTERNAL · DRAFT</div>
  <div class="date-block">
    <div class="date-label">REPORTING DATE</div>
    <div class="date-value" data-slot="date">May 25, 2026</div>
  </div>
</body>
</html>
