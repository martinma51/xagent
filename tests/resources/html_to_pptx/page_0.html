<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<style>
  body { margin: 0; width: 1280px; height: 720px; background-image: linear-gradient(135deg, rgb(15, 23, 42), rgb(30, 58, 138)); font-family: Inter, system-ui, sans-serif; }
  .slide-container { position: relative; width: 1280px; height: 720px; }
  .title { position: absolute; left: 80px; top: 120px; width: 1100px; font-size: 64px; font-weight: 700; color: rgb(255, 255, 255); }
  .subtitle { position: absolute; left: 80px; top: 220px; width: 900px; font-size: 24px; color: rgb(148, 163, 184); }
  .card { position: absolute; width: 280px; height: 120px; background-color: rgb(30, 41, 59); border-radius: 16px; padding: 0; }
  .card h3 { position: absolute; left: 16px; top: 12px; font-size: 18px; font-weight: 600; color: rgb(96, 165, 250); margin: 0; }
  .card p  { position: absolute; left: 16px; top: 48px; font-size: 14px; color: rgb(203, 213, 225); margin: 0; }
</style>
</head>
<body>
  <div class="slide-container">
    <div class="title">Test Deck</div>
    <div class="subtitle">A minimal page for verifying html_to_pptx</div>
    <div class="card" style="left: 80px; top: 440px;">
      <h3>Feature One</h3><p>First card body text</p>
    </div>
    <div class="card" style="left: 400px; top: 440px;">
      <h3>Feature Two</h3><p>Second card body text</p>
    </div>
    <div class="card" style="left: 720px; top: 440px;">
      <h3>Feature Three</h3><p>Third card body text</p>
    </div>
  </div>
</body>
</html>
