<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<style>
  body { margin: 0; width: 1280px; height: 720px; background-color: rgb(248, 250, 252); font-family: Inter, system-ui, sans-serif; }
  .slide-container { position: relative; width: 1280px; height: 720px; }
  .heading { position: absolute; left: 80px; top: 80px; width: 1100px; font-size: 56px; font-weight: 700; color: rgb(15, 23, 42); }
  .bullet  { position: absolute; left: 80px; font-size: 22px; color: rgb(51, 65, 85); }
  .accent  { position: absolute; left: 60px; width: 8px; height: 24px; background-color: rgb(59, 130, 246); border-radius: 4px; }
</style>
</head>
<body>
  <div class="slide-container">
    <div class="heading">Second Page</div>
    <div class="accent"  style="top: 240px;"></div>
    <div class="bullet" style="top: 240px;">First bullet point demonstrating absolute layout</div>
    <div class="accent"  style="top: 300px;"></div>
    <div class="bullet" style="top: 300px;">Second bullet point with longer body text</div>
    <div class="accent"  style="top: 360px;"></div>
    <div class="bullet" style="top: 360px;">Third bullet</div>
  </div>
</body>
</html>
